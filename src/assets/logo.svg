<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Gradient -->
    <linearGradient id="lingoPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Secondary Gradient for Left Bubble -->
    <linearGradient id="bubbleLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Secondary Gradient for Right Bubble -->
    <linearGradient id="bubbleRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container Icon Group -->
  <g filter="url(#logoGlow)">
    <!-- Globe Outer Ring / Network Nodes Background Arc -->
    <path d="M 120 256 A 136 136 0 0 1 392 256" fill="none" stroke="url(#lingoPrimaryGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.4" />

    <!-- Connecting Bridge Arch (Connecting Language A & B) -->
    <path d="M 140 260 C 200 130, 312 130, 372 260" fill="none" stroke="url(#lingoPrimaryGrad)" stroke-width="24" stroke-linecap="round" />

    <!-- Bridge Deck / Secondary Beam -->
    <path d="M 170 245 Q 256 185, 342 245" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.8" stroke-linecap="round" />

    <!-- Left Speech Bubble (Language Input Node) -->
    <g transform="translate(40, 0)">
      <path d="M 120 230 C 75 230 40 265 40 310 C 40 338 54 362 76 376 L 65 415 L 110 395 C 113 396 117 396 120 396 C 165 396 200 361 200 316 C 200 271 165 230 120 230 Z" fill="url(#bubbleLeftGrad)" />
      <!-- Language Symbol 'A' -->
      <text x="120" y="328" font-family="'Inter', sans-serif" font-weight="800" font-size="52" fill="#ffffff" text-anchor="middle">A</text>
    </g>

    <!-- Right Speech Bubble (Language Output Node) -->
    <g transform="translate(-40, 0)">
      <path d="M 392 230 C 347 230 312 271 312 316 C 312 361 347 396 392 396 C 395 396 399 396 402 395 L 447 415 L 436 376 C 458 362 472 338 472 310 C 472 265 437 230 392 230 Z" fill="url(#bubbleRightGrad)" />
      <!-- Asian / Global Language Character '文' (Translation / Script) -->
      <text x="392" y="328" font-family="'Inter', sans-serif" font-weight="700" font-size="48" fill="#ffffff" text-anchor="middle">文</text>
    </g>

    <!-- Central Connection Pulse Star / Bridge Keystone -->
    <circle cx="256" cy="180" r="16" fill="#ffffff" />
    <circle cx="256" cy="180" r="10" fill="url(#lingoPrimaryGrad)" />
  </g>
</svg>
